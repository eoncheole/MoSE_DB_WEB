# Alembic config for MoSE DB.
# Run from the `backend/` directory:
#     alembic upgrade head        # apply all migrations
#     alembic revision -m "msg"   # create a new (empty) revision
#     alembic revision --autogenerate -m "msg"   # diff models <-> DB
#
# The DB URL is read from the DATABASE_URL env var inside env.py
# (falls back to sqlite:///./mose.db to match app/database.py).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally blank — env.py overrides it.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
